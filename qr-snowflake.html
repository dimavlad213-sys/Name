<style>

</style></head><body><div class="wrap"><div class="poster" id="poster"><h1>НОВОГОДНЕЕ ЧУДО</h1><div class="sub">Поймай снежинку — открой поздравление</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const target='https://dimavlad213-sys.github.io/Name/';const q=document.getElementById('qrcode');const status=document.getElementById('status');const btn=document.getElementById('download');
if(window.QRCode){new QRCode(q,{text:target,width:420,height:420,colorDark:'#102a40',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});status.textContent='QR-код создан. Наведи камеру телефона или скачай готовую картинку.';btn.disabled=false}else{status.innerHTML='<span class="error">Не удалось загрузить генератор QR-кода. Проверь подключение к интернету и обнови страницу.</span>'}
btn.onclick=()=>{const qr=q.querySelector('canvas')||q.querySelector('img');if(!qr)return;const source=qr.tagName==='IMG'?qr:qr;const out=document.createElement('canvas');out.width=1080;out.height=1350;const c=out.getContext('2d');const g=c.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#fbfeff');g.addColorStop(.55,'#dcefff');g.addColorStop(1,'#f8fdff');c.fillStyle=g;c.fillRect(0,0,1080,1350);c.strokeStyle='#a6cce2';c.lineWidth=5;c.strokeRect(38,38,1004,1274);c.textAlign='center';c.fillStyle='#244e70';c.font='bold 65px Arial';c.fillText('НОВОГОДНЕЕ ЧУДО',540,145);c.fillStyle='#5d819c';c.font='24px Arial';c.fillText('ПОЙМАЙ СНЕЖИНКУ — ОТКРОЙ ПОЗДРАВЛЕНИЕ',540,205);
c.save();c.translate(540,690);c.strokeStyle='#a9cfe5';c.lineWidth=12;c.lineCap='round';for(let a=0;a<6;a++){c.save();c.rotate(a*Math.PI/3);c.beginPath();c.moveTo(0,-500);c.lineTo(0,500);c.stroke();for(let y=-390;y<=390;y+=130){c.beginPath();c.moveTo(0,y);c.lineTo(-65,y-65);c.moveTo(0,y);c.lineTo(65,y-65);c.stroke()}c.restore()}c.restore();
c.fillStyle='#fff';c.shadowColor='#47799a55';c.shadowBlur=35;c.fillRect(260,410,560,560);c.shadowBlur=0;c.drawImage(source,290,440,500,500);c.fillStyle='#244e70';c.font='bold 37px Arial';c.fillText('ОТСКАНИРУЙ И ОТКРОЙ СВОЁ ЧУДО',540,1090);c.fillStyle='#5d819c';c.font='25px Arial';c.fillText('С НОВЫМ 2027 ГОДОМ · ГОД ОГНЕННОЙ КОЗЫ',540,1150);const a=document.createElement('a');a.download='snezhinka-qr-novogodnyaya-otkrytka.png';a.href=out.toDataURL('image/png');a.click()};
